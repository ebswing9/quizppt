<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퀴즈 관리자</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="config.js"></script>
</head>
<body>

<!-- ===== 로그인 ===== -->
<div id="view-login" class="view">
  <div class="login-box card">
    <h2>관리자 로그인</h2>
    <input type="password" id="login-password" placeholder="비밀번호">
    <button class="btn-primary btn-block" style="margin-top:12px;" id="btn-login">로그인</button>
    <div class="error-text hidden" id="login-error">비밀번호가 틀렸어요.</div>
  </div>
</div>

<!-- ===== 메인 패널 ===== -->
<div id="view-main" class="view hidden">
  <div class="container">
    <h1 class="page-title">
      퀴즈 관리자
      <a href="index.html" target="_blank" title="퀴즈 보기 (index)" style="text-decoration:none; font-size:0.6em; vertical-align:middle; margin-left:6px;">🔗</a>
    </h1>
    <div style="text-align:center; margin-bottom:16px;">
      <button class="btn-ghost btn-sm" id="btn-logout">로그아웃</button>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" data-tab="design">🎨 사이트 디자인</button>
      <button class="tab-btn" data-tab="sets">📝 퀴즈 세트</button>
    </div>

    <!-- ===== 탭: 사이트 디자인 ===== -->
    <div id="tab-design" class="tab-panel">
      <div class="card">
        <h3 style="margin-top:0;">색상</h3>
        <div class="color-row">
          <label>배경색 1 <input type="color" id="bg-color-1"></label>
          <label>배경색 2 <input type="color" id="bg-color-2"></label>
          <label>버튼 색 <input type="color" id="btn-color"></label>
        </div>

        <h3>테마 프리셋</h3>
        <div class="preset-row" id="theme-presets"></div>
        <p class="field-note">누르면 색이 바뀌어 바로 미리 볼 수 있어요. 마음에 들면 아래 저장 버튼을 눌러주세요.</p>

        <h3>문제 폰트</h3>
        <div class="color-row">
          <select id="font-select-q" style="flex:1; min-width:160px;"></select>
          <label>크기(px) <input type="number" id="q-font-size" style="width:70px;" min="16" max="100"></label>
        </div>
        <div id="font-preview-q" class="card" style="margin-top:10px; text-align:center; padding:14px;">문제 미리보기 텍스트입니다</div>

        <h3>보기 폰트</h3>
        <div class="color-row">
          <select id="font-select-c" style="flex:1; min-width:160px;"></select>
          <label>크기(px) <input type="number" id="c-font-size" style="width:70px;" min="10" max="40"></label>
        </div>
        <div id="font-preview-c" class="card" style="margin-top:10px; text-align:center; padding:14px;">보기 미리보기 텍스트</div>

        <!-- 폰트 즐겨찾기 관리 (접기/펼치기) -->
        <div class="q-editor-header" id="toggle-font-manager" style="margin-top:20px;">
          <span class="q-editor-headline">⚙️ 폰트 즐겨찾기 관리</span>
          <span class="q-editor-caret" id="font-manager-caret">▸</span>
        </div>
        <div id="font-manager-body" class="hidden" style="margin-top:12px;">
          <div id="font-preset-list" style="margin-bottom:14px;"></div>
          <label class="field-label">새 폰트 이름 (CSS font-family 값)</label>
          <input type="text" id="new-font-name" placeholder="예: Gaegu">
          <label class="field-label">폰트 임베드 — URL 또는 @font-face 코드 전체</label>
          <textarea id="new-font-url" style="min-height:70px; font-family:monospace; font-size:13px;" placeholder="예1) https://fonts.googleapis.com/css2?family=Gaegu&display=swap
예2) @font-face { font-family: 'Aggravo'; src: url('...') format('woff'); font-weight:300; font-display:swap; }"></textarea>
          <button class="btn-ghost btn-sm" style="margin-top:8px;" id="btn-add-font-preset">즐겨찾기에 추가</button>
        </div>

        <div style="margin-top:20px;">
          <button class="btn-gold btn-sm" id="btn-save-colors">저장</button>
          <button class="btn-ghost btn-sm" id="btn-backup">전체 백업 다운로드</button>
        </div>
      </div>
    </div>

    <!-- ===== 탭: 퀴즈 세트 ===== -->
    <div id="tab-sets" class="tab-panel hidden">
      <div class="top-actions">
        <h3 style="margin:0;">퀴즈 세트</h3>
        <button class="btn-primary" id="btn-new-set">+ 새 세트 만들기</button>
      </div>
      <div id="set-list" class="set-list"></div>

      <!-- 세트 에디터 -->
      <div id="editor" class="card hidden" style="margin-top:24px;">
        <div class="top-actions">
          <h3 style="margin:0;" id="editor-title-label">새 세트</h3>
          <div>
            <button class="btn-ghost btn-sm" id="btn-cancel-edit">취소</button>
            <button class="btn-mint btn-sm" id="btn-save-set">저장</button>
        </div>
      </div>
      <label class="field-label">세트 제목</label>
      <input type="text" id="set-title" placeholder="예: 1단원 형성평가">

      <div id="questions-wrap"></div>

      <button class="btn-ghost btn-block" style="margin-top:16px;" id="btn-add-question">+ 문제 추가</button>
      <button class="btn-mint btn-block" style="margin-top:10px;" id="btn-save-set-bottom">저장</button>
    </div>
    </div> <!-- /tab-sets -->
  </div>
</div>

<!-- PPTX 캡처용 (화면엔 안 보임) -->
<div id="pptx-slide" style="position:fixed; left:-99999px; top:0;">
  <div id="pptx-slide-inner" class="pptx-slide">
    <div class="card question-card" id="pptx-question-card"></div>
  </div>
</div>
<div id="loading-overlay" class="loading-overlay hidden">
  <div>⏳ PPTX 만드는 중...</div>
  <div id="loading-progress" style="font-size:13px;color:var(--text-muted);"></div>
</div>

<script>
let sessionPassword = "";
let sets = [];
let editingId = null;       // 수정 중인 세트 id (null이면 새 세트)
let editingQuestions = [];  // 에디터에서 편집 중인 문제 배열

// ---------- 로그인 ----------
document.getElementById("btn-login").addEventListener("click", () => login(document.getElementById("login-password").value));
document.getElementById("login-password").addEventListener("keydown", e => { if (e.key === "Enter") login(document.getElementById("login-password").value); });
document.getElementById("btn-logout").addEventListener("click", () => {
  localStorage.removeItem("quiz_admin_pw");
  location.reload();
});

async function login(pw) {
  const res = await apiPost("login", { password: pw });
  if (res.ok) {
    sessionPassword = pw;
    localStorage.setItem("quiz_admin_pw", pw); // 다음 방문 때 자동 로그인
    document.getElementById("view-login").classList.add("hidden");
    document.getElementById("view-main").classList.remove("hidden");
    await applyBackgroundColors();
    await loadSettings();
    await loadSets();
  } else {
    document.getElementById("login-error").classList.remove("hidden");
  }
}

// 페이지를 열 때, 저장된 비밀번호가 있으면 자동으로 로그인 시도
(function tryAutoLogin() {
  const saved = localStorage.getItem("quiz_admin_pw");
  if (saved) login(saved);
})();

// ---------- 탭 전환 ----------
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-design").classList.toggle("hidden", btn.dataset.tab !== "design");
    document.getElementById("tab-sets").classList.toggle("hidden", btn.dataset.tab !== "sets");
  });
});

// 폰트 즐겨찾기 관리 패널 접기/펼치기
document.getElementById("toggle-font-manager").addEventListener("click", () => {
  const body = document.getElementById("font-manager-body");
  const isHidden = body.classList.toggle("hidden");
  document.getElementById("font-manager-caret").innerText = isHidden ? "▸" : "▾";
});

// ---------- 설정(색상/폰트) ----------
let fontPresets = [];
let currentQFont = { name: "Jua", url: "" };
let currentCFont = { name: "Jua", url: "" };

async function loadSettings() {
  const res = await apiGet("settings");
  if (res.ok) {
    document.getElementById("bg-color-1").value = res.settings.bgColor1 || "#F3EEFF";
    document.getElementById("bg-color-2").value = res.settings.bgColor2 || "#EAF6FF";
    document.getElementById("btn-color").value = res.settings.buttonColor || "#DCCBFF";
    document.getElementById("q-font-size").value = res.settings.questionFontSize || 44;
    document.getElementById("c-font-size").value = res.settings.choiceFontSize || 16;
    currentQFont = { name: res.settings.questionFontName || "Jua", url: res.settings.questionFontUrl || "" };
    currentCFont = { name: res.settings.choiceFontName || "Jua", url: res.settings.choiceFontUrl || "" };
    try { fontPresets = JSON.parse(res.settings.fontPresets || "[]"); } catch (e) { fontPresets = []; }
    renderFontSelects();
    renderFontPresetList();
    updateFontPreview("q");
    updateFontPreview("c");
  }
}

// 종류 드롭다운: 즐겨찾기 목록에서만 고름
function renderFontSelects() {
  ["q", "c"].forEach(suffix => {
    const cur = suffix === "q" ? currentQFont : currentCFont;
    const sel = document.getElementById(`font-select-${suffix}`);
    sel.innerHTML = "";
    let matched = false;
    fontPresets.forEach((p, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.innerText = p.name;
      if (p.name === cur.name) { opt.selected = true; matched = true; }
      sel.appendChild(opt);
    });
    if (!matched && fontPresets.length > 0) {
      // 즐겨찾기에 없는 값이 현재 설정돼 있는 경우, 안내용 옵션을 하나 보여줌
      const opt = document.createElement("option");
      opt.value = "-1";
      opt.innerText = `${cur.name} (즐겨찾기에 없음)`;
      opt.selected = true;
      sel.prepend(opt);
    }
    if (fontPresets.length === 0) {
      const opt = document.createElement("option");
      opt.innerText = "즐겨찾기를 먼저 추가해주세요";
      sel.appendChild(opt);
    }
  });
}

document.getElementById("font-select-q").addEventListener("change", (e) => {
  if (e.target.value === "" || e.target.value === "-1") return;
  currentQFont = fontPresets[Number(e.target.value)];
  updateFontPreview("q");
});
document.getElementById("font-select-c").addEventListener("change", (e) => {
  if (e.target.value === "" || e.target.value === "-1") return;
  currentCFont = fontPresets[Number(e.target.value)];
  updateFontPreview("c");
});
document.getElementById("q-font-size").addEventListener("input", () => updateFontPreview("q"));
document.getElementById("c-font-size").addEventListener("input", () => updateFontPreview("c"));

function updateFontPreview(suffix) {
  const font = suffix === "q" ? currentQFont : currentCFont;
  const size = suffix === "q" ? document.getElementById("q-font-size").value || 44 : document.getElementById("c-font-size").value || 16;
  applyFontEmbed(font.url, "preview-" + suffix);
  const preview = document.getElementById(`font-preview-${suffix}`);
  preview.style.fontFamily = `'${font.name}', 'Pretendard', sans-serif`;
  preview.style.fontSize = size + "px";
  preview.innerText = suffix === "q" ? "문제 미리보기 텍스트입니다" : "보기 미리보기 텍스트";
}

// ---------- 폰트 즐겨찾기 관리 ----------
function renderFontPresetList() {
  const wrap = document.getElementById("font-preset-list");
  if (fontPresets.length === 0) { wrap.innerHTML = `<p style="color:var(--text-faint); font-size:13px;">즐겨찾기에 등록된 폰트가 없어요.</p>`; return; }
  wrap.innerHTML = "";
  fontPresets.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "font-preset-row";
    row.innerHTML = `<span>${escapeHtml(p.name)}</span><button class="btn-danger btn-sm" data-del-preset="${i}">삭제</button>`;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll("[data-del-preset]").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.dataset.delPreset);
      if (!confirm(`"${fontPresets[idx].name}" 즐겨찾기를 삭제할까요?`)) return;
      fontPresets.splice(idx, 1);
      renderFontPresetList();
      renderFontSelects();
    });
  });
}

document.getElementById("btn-add-font-preset").addEventListener("click", () => {
  const name = document.getElementById("new-font-name").value.trim();
  const url = document.getElementById("new-font-url").value.trim();
  if (!name || !url) { alert("폰트 이름과 링크(또는 코드)를 입력해주세요."); return; }
  if (fontPresets.some(p => p.name === name)) { alert("이미 즐겨찾기에 있는 이름이에요."); return; }
  fontPresets.push({ name, url });
  document.getElementById("new-font-name").value = "";
  document.getElementById("new-font-url").value = "";
  renderFontPresetList();
  renderFontSelects();
});

// 색상 피커를 움직이는 즉시 실시간으로 반영 (저장 전 미리보기, API 호출 없음)
["bg-color-1", "bg-color-2", "btn-color"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    setBgVars({
      bgColor1: document.getElementById("bg-color-1").value,
      bgColor2: document.getElementById("bg-color-2").value,
      buttonColor: document.getElementById("btn-color").value
    });
  });
});

// ---------- 테마 프리셋 ----------
const THEME_PRESETS = [
  { emoji: "🍇", name: "포도",       bg1: "#F3EEFF", bg2: "#EAF6FF", btn: "#DCCBFF" },
  { emoji: "🍓", name: "딸기우유",   bg1: "#FFF0F5", bg2: "#FFE9F0", btn: "#FFC2D6" },
  { emoji: "🍃", name: "민트",       bg1: "#E8F8F2", bg2: "#EEF7E6", btn: "#A8E6D5" },
  { emoji: "🍋", name: "레몬",       bg1: "#FFFBE6", bg2: "#FFF1CC", btn: "#FFE08A" },
  { emoji: "🍑", name: "복숭아",     bg1: "#FFF1EA", bg2: "#FFF8E6", btn: "#FFC9B5" },
  { emoji: "🌊", name: "바다",       bg1: "#E6F4FF", bg2: "#E3FBF7", btn: "#A9D6FF" },
  { emoji: "📓", name: "노트",       bg1: "#FBF7EE", bg2: "#F3EEE0", btn: "#EAD9B0" }
];
(function renderThemePresets() {
  const wrap = document.getElementById("theme-presets");
  THEME_PRESETS.forEach(p => {
    const b = document.createElement("button");
    b.className = "preset-chip btn-ghost";
    b.innerHTML = `<span class="preset-swatch" style="background:linear-gradient(135deg, ${p.bg1} 50%, ${p.btn} 50%)"></span>${p.emoji} ${p.name}`;
    b.addEventListener("click", () => {
      document.getElementById("bg-color-1").value = p.bg1;
      document.getElementById("bg-color-2").value = p.bg2;
      document.getElementById("btn-color").value = p.btn;
      setBgVars({ bgColor1: p.bg1, bgColor2: p.bg2, buttonColor: p.btn });
    });
    wrap.appendChild(b);
  });
})();

document.getElementById("btn-save-colors").addEventListener("click", async () => {
  const bgColor1 = document.getElementById("bg-color-1").value;
  const bgColor2 = document.getElementById("bg-color-2").value;
  const buttonColor = document.getElementById("btn-color").value;
  const questionFontSize = document.getElementById("q-font-size").value;
  const choiceFontSize = document.getElementById("c-font-size").value;
  await apiPost("saveSettings", {
    password: sessionPassword, bgColor1, bgColor2, buttonColor,
    questionFontName: currentQFont.name, questionFontUrl: currentQFont.url,
    choiceFontName: currentCFont.name, choiceFontUrl: currentCFont.url,
    fontPresets: JSON.stringify(fontPresets), questionFontSize, choiceFontSize
  });
  localStorage.removeItem("quiz_bgColors");
  await applyBackgroundColors();
  alert("저장됐어요.");
});

document.getElementById("btn-backup").addEventListener("click", async () => {
  const res = await apiGet("backupAll");
  if (!res.ok) { alert("백업 실패"); return; }
  const blob = new Blob([JSON.stringify(res.sets, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `quiz_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

// ---------- 세트 목록 ----------
async function loadSets() {
  const res = await apiGet("sets");
  if (!res.ok) { alert("세트 목록을 불러오지 못했어요."); return; }
  sets = res.sets;
  renderSetList();
}

function renderSetList() {
  const wrap = document.getElementById("set-list");
  if (sets.length === 0) { wrap.innerHTML = "<p>아직 등록된 세트가 없어요.</p>"; return; }
  wrap.innerHTML = "";
  sets.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "set-card";
    el.innerHTML = `
      <div>
        <div class="set-title">${escapeHtml(s.title)}</div>
        <div class="set-meta">${s.visible === false ? "🙈 숨김" : "👀 공개중"} · 사용 ${s.useCount || 0}회 ${s.lastUsedAt ? "· 마지막 " + fmtDate(s.lastUsedAt) : ""}</div>
      </div>
      <div class="set-actions">
        <button class="btn-ghost" data-act="up">↑</button>
        <button class="btn-ghost" data-act="down">↓</button>
        <button class="btn-ghost" data-act="vis">${s.visible === false ? "공개하기" : "숨기기"}</button>
        <button class="btn-ghost" data-act="edit">편집</button>
        <button class="btn-ghost" data-act="dup">복제</button>
        <button class="btn-ghost" data-act="pptx">PPTX</button>
        <button class="btn-danger" data-act="del">삭제</button>
      </div>
    `;
    el.querySelector('[data-act=up]').addEventListener("click", (e) => { e.stopPropagation(); moveSet(i, -1); });
    el.querySelector('[data-act=down]').addEventListener("click", (e) => { e.stopPropagation(); moveSet(i, 1); });
    el.querySelector('[data-act=vis]').addEventListener("click", async (e) => {
      e.stopPropagation();
      await apiPost("setVisibility", { password: sessionPassword, id: s.id, visible: s.visible === false });
      loadSets();
    });
    el.querySelector('[data-act=edit]').addEventListener("click", (e) => { e.stopPropagation(); openEditor(s.id); });
    el.querySelector('[data-act=pptx]').addEventListener("click", (e) => { e.stopPropagation(); exportPptxForSet(s.id); });
    el.querySelector('[data-act=dup]').addEventListener("click", async (e) => {
      e.stopPropagation();
      await apiPost("duplicateSet", { password: sessionPassword, id: s.id });
      loadSets();
    });
    el.querySelector('[data-act=del]').addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm(`"${s.title}" 세트를 삭제할까요? 되돌릴 수 없어요.`)) return;
      await apiPost("deleteSet", { password: sessionPassword, id: s.id });
      loadSets();
    });
    wrap.appendChild(el);
  });
}

async function moveSet(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= sets.length) return;
  [sets[i], sets[j]] = [sets[j], sets[i]];
  renderSetList();
  await apiPost("reorderSets", { password: sessionPassword, order: sets.map(s => s.id) });
}

// ---------- 세트 에디터 ----------
document.getElementById("btn-new-set").addEventListener("click", () => openEditor(null));
document.getElementById("btn-cancel-edit").addEventListener("click", closeEditor);
document.getElementById("btn-add-question").addEventListener("click", () => {
  editingQuestions.forEach(q => q.collapsed = true); // 기존 문제는 자동으로 접기
  editingQuestions.push(newQuestion());
  renderEditor();
});
document.getElementById("btn-save-set").addEventListener("click", saveSet);
document.getElementById("btn-save-set-bottom").addEventListener("click", saveSet);

async function openEditor(id) {
  editingId = id;
  if (id) {
    const res = await apiGet("set", { id });
    if (!res.ok) { alert("불러오기 실패"); return; }
    document.getElementById("set-title").value = res.set.title;
    editingQuestions = res.set.questions.map(q => normalizeQuestion({
      ...q,
      correctIndex: q.type === "mcq" ? (q.choices || []).indexOf(q.answer) : 0,
      collapsed: true
    }));
    document.getElementById("editor-title-label").innerText = "세트 편집";
  } else {
    document.getElementById("set-title").value = "";
    editingQuestions = [];
    document.getElementById("editor-title-label").innerText = "새 세트";
  }
  renderEditor();
  document.getElementById("editor").classList.remove("hidden");
  document.getElementById("editor").scrollIntoView({ behavior: "smooth" });
}

function closeEditor() {
  document.getElementById("editor").classList.add("hidden");
  editingId = null;
  editingQuestions = [];
}

const TYPE_LABEL = { ox: "OX", mcq: "객관식", short: "주관식", match: "연결형", order: "순서 맞추기", sort: "분류", blank: "빈칸" };
const TYPE_ORDER = ["ox", "mcq", "short", "match", "order", "sort", "blank"]; // 라디오 표시 순서
const MAX_PAIRS = 5;       // 연결형 최대 짝 수 (슬라이드 한 장에 들어가는 개수)
const MAX_ORDER = 6;       // 순서 맞추기 최대 항목 수
const MAX_GROUPS = 3;      // 분류 최대 분류 수
const MAX_SORT_ITEMS = 8;  // 분류형 전체 항목 수

function groupItems(g) { return (g.itemsText || "").split("\n").map(s => s.trim()).filter(Boolean); }
function validateQuestion(q) {
  if (q.type === "match" && q.pairs.filter(p => p.left.trim() && p.right.trim()).length < 2) return "연결형은 짝을 2개 이상 입력해주세요.";
  if (q.type === "order" && q.items.filter(s => s.trim()).length < 2) return "순서 맞추기는 항목을 2개 이상 입력해주세요.";
  if (q.type === "sort") {
    if (q.groups.some(g => !g.name.trim() || groupItems(g).length === 0)) return "분류 이름과 항목을 모두 입력해주세요.";
    if (q.groups.reduce((n, g) => n + groupItems(g).length, 0) > MAX_SORT_ITEMS) return `분류형 항목은 전체 ${MAX_SORT_ITEMS}개까지 가능해요.`;
  }
  if (q.type === "blank" && !/\[[^\]]+\]/.test(q.question || "")) return "빈칸 채우기는 문제 칸에서 가릴 부분을 [대괄호]로 표시해주세요.";
  return "";
}

function newQuestion() {
  return normalizeQuestion({ type: "ox", question: "", image: "", answer: "O", altAnswers: "", hint: "", explanation: "", collapsed: false });
}
// 유형을 바꿔도 에디터가 깨지지 않도록 모든 유형의 필드를 보정
function normalizeQuestion(q) {
  const ch = Array.isArray(q.choices) ? q.choices.slice() : [];
  while (ch.length < 2) ch.push("");
  q.choices = ch;
  const pr = Array.isArray(q.pairs) ? q.pairs.map(p => ({ left: p.left || "", right: p.right || "" })) : [];
  while (pr.length < 2) pr.push({ left: "", right: "" });
  q.pairs = pr;
  const it = Array.isArray(q.items) ? q.items.slice() : [];
  while (it.length < 2) it.push("");
  q.items = it;
  const gr = Array.isArray(q.groups) ? q.groups.map(g => ({ name: g.name || "", itemsText: g.itemsText != null ? g.itemsText : (g.items || []).join("\n") })) : [];
  while (gr.length < 2) gr.push({ name: "", itemsText: "" });
  q.groups = gr;
  if (!(q.correctIndex >= 0)) q.correctIndex = 0;
  return q;
}

function renderEditor() {
  const wrap = document.getElementById("questions-wrap");
  wrap.innerHTML = "";
  editingQuestions.forEach((q, idx) => {
    const item = document.createElement("div");
    item.className = "q-editor-item";

    // ---- 헤더 (접기/펼치기 + 순서변경 + 삭제) ----
    let inner = `
      <div class="q-editor-header" data-toggle-collapse="${idx}">
        <span class="q-editor-headline">문제 ${idx + 1} · ${TYPE_LABEL[q.type]} ${q.question ? "— " + escapeHtml(q.question.slice(0, 24)) + (q.question.length > 24 ? "…" : "") : ""}</span>
        <span class="q-editor-header-btns">
          <button class="btn-ghost btn-sm" data-move-q="${idx}:-1" title="위로">↑</button>
          <button class="btn-ghost btn-sm" data-move-q="${idx}:1" title="아래로">↓</button>
          <button class="btn-danger btn-sm" data-remove-q="${idx}">삭제</button>
          <span class="q-editor-caret">${q.collapsed ? "▸" : "▾"}</span>
        </span>
      </div>
    `;

    if (!q.collapsed) {
      inner += `<div class="q-editor-body">`;
      inner += `
        <div class="type-radio-group">
          ${TYPE_ORDER.map(t => `<label class="type-radio"><input type="radio" name="type-${idx}" data-qidx="${idx}" data-field="type" value="${t}" ${q.type === t ? "checked" : ""}> ${TYPE_LABEL[t]}</label>`).join("")}
        </div>
        <label class="field-label">문제</label>
        <textarea data-qidx="${idx}" data-field="question" placeholder="문제를 입력하세요">${escapeHtml(q.question)}</textarea>

        <label class="field-label">이미지 (선택)</label>
        <input type="file" accept="image/*" data-qidx="${idx}" data-field="image-upload">
        ${q.image ? `<img class="img-preview" src="${q.image}">` : ""}
      `;

      if (q.type === "mcq") {
        inner += `<label class="field-label">보기 (동그라미 = 정답)</label>`;
        q.choices.forEach((c, cidx) => {
          inner += `
            <div class="choice-row">
              <input type="radio" name="correct-${idx}" data-qidx="${idx}" data-field="mcq-correct" data-cidx="${cidx}" ${q.correctIndex === cidx ? "checked" : ""}>
              <input type="text" data-qidx="${idx}" data-field="choice" data-cidx="${cidx}" value="${escapeAttr(c)}" placeholder="보기 ${cidx + 1}">
              <button class="btn-ghost btn-sm" data-remove-choice="${idx}:${cidx}">삭제</button>
            </div>
          `;
        });
        inner += `<button class="btn-ghost btn-sm" data-add-choice="${idx}">+ 보기 추가</button>`;
      } else if (q.type === "ox") {
        inner += `
          <label class="field-label">정답</label>
          <div class="choice-row">
            <label><input type="radio" name="ox-${idx}" data-qidx="${idx}" data-field="ox-answer" value="O" ${q.answer === "O" ? "checked" : ""}> O</label>
            <label style="margin-left:16px;"><input type="radio" name="ox-${idx}" data-qidx="${idx}" data-field="ox-answer" value="X" ${q.answer === "X" ? "checked" : ""}> X</label>
          </div>
        `;
      } else if (q.type === "order") {
        inner += `<label class="field-label">항목 — 정답 순서대로 위에서부터 입력하세요. 슬라이드에서는 자동으로 섞여요. (2~${MAX_ORDER}개)</label>`;
        q.items.forEach((t, oidx) => {
          inner += `
            <div class="pair-row">
              <span class="pair-no">${oidx + 1}</span>
              <input type="text" data-qidx="${idx}" data-field="order-item" data-oidx="${oidx}" value="${escapeAttr(t)}" placeholder="${oidx + 1}번째 항목">
              <button class="btn-ghost btn-sm" data-remove-order="${idx}:${oidx}">삭제</button>
            </div>
          `;
        });
        if (q.items.length < MAX_ORDER) inner += `<button class="btn-ghost btn-sm" data-add-order="${idx}">+ 항목 추가</button>`;
      } else if (q.type === "sort") {
        inner += `<label class="field-label">분류 이름과, 그 분류에 속하는 항목들(한 줄에 하나)을 입력하세요. 항목은 전체 ${MAX_SORT_ITEMS}개까지예요.</label>`;
        q.groups.forEach((g, gidx) => {
          inner += `
            <div class="q-editor-item" style="margin-top:10px;">
              <div class="pair-row">
                <input type="text" data-qidx="${idx}" data-field="group-name" data-gidx="${gidx}" value="${escapeAttr(g.name)}" placeholder="분류 ${gidx + 1} 이름 (예: 산성)">
                <button class="btn-ghost btn-sm" data-remove-group="${idx}:${gidx}">삭제</button>
              </div>
              <textarea data-qidx="${idx}" data-field="group-items" data-gidx="${gidx}" placeholder="항목을 한 줄에 하나씩">${escapeHtml(g.itemsText)}</textarea>
            </div>
          `;
        });
        if (q.groups.length < MAX_GROUPS) inner += `<button class="btn-ghost btn-sm" style="margin-top:10px;" data-add-group="${idx}">+ 분류 추가</button>`;
      } else if (q.type === "blank") {
        inner += `<p class="field-note">위 '문제' 칸에 문장을 쓰고, 가릴 부분을 [대괄호]로 감싸세요. 예) 광합성은 [엽록체]에서 일어난다. 슬라이드에서는 빈칸을 눌러 하나씩 열 수 있어요.</p>`;
      } else if (q.type === "match") {
        inner += `<label class="field-label">짝 맞추기 — 같은 줄의 왼쪽·오른쪽이 정답 짝이에요. 슬라이드에서는 왼쪽·오른쪽이 서로 다른 색의 두 열로 나뉘어 표시되고, 오른쪽 순서는 자동으로 섞여요.</label>`;
        q.pairs.forEach((p, pidx) => {
          inner += `
            <div class="pair-row">
              <span class="pair-no">${pidx + 1}</span>
              <input type="text" data-qidx="${idx}" data-field="pair-left" data-pidx="${pidx}" value="${escapeAttr(p.left)}" placeholder="왼쪽 항목">
              <span class="pair-arrow">↔</span>
              <input type="text" data-qidx="${idx}" data-field="pair-right" data-pidx="${pidx}" value="${escapeAttr(p.right)}" placeholder="짝이 되는 항목">
              <button class="btn-ghost btn-sm" data-remove-pair="${idx}:${pidx}">삭제</button>
            </div>
          `;
        });
        if (q.pairs.length < MAX_PAIRS) inner += `<button class="btn-ghost btn-sm" data-add-pair="${idx}">+ 짝 추가</button>`;
      } else {
        inner += `
          <label class="field-label">정답</label>
          <input type="text" data-qidx="${idx}" data-field="answer" value="${escapeAttr(q.answer)}" placeholder="모범 답안">
          <label class="field-label">추가로 인정할 답안 (선택)</label>
          <input type="text" data-qidx="${idx}" data-field="altAnswers" value="${escapeAttr(q.altAnswers)}" placeholder="예: 삼투압, 삼투현상">
          <label class="field-label">힌트 (선택, 정답 공개 전 학생들에게 보여줄 단서)</label>
          <textarea data-qidx="${idx}" data-field="hint" placeholder="예: 삼투 O 자로 시작해요">${escapeHtml(q.hint || "")}</textarea>
        `;
      }

      inner += `
        <label class="field-label">해설 (선택)</label>
        <textarea data-qidx="${idx}" data-field="explanation" placeholder="정답 화면에 함께 보여줄 해설">${escapeHtml(q.explanation || "")}</textarea>
      `;
      inner += `</div>`;
    }

    item.innerHTML = inner;
    wrap.appendChild(item);
  });
}

// 입력값 변경 반영 (구조 변경 없는 것들)
document.getElementById("questions-wrap").addEventListener("input", (e) => {
  const idx = e.target.dataset.qidx;
  const field = e.target.dataset.field;
  if (idx === undefined || !field) return;
  const q = editingQuestions[idx];
  if (field === "choice") {
    q.choices[e.target.dataset.cidx] = e.target.value;
  } else if (field === "pair-left" || field === "pair-right") {
    q.pairs[e.target.dataset.pidx][field === "pair-left" ? "left" : "right"] = e.target.value;
  } else if (field === "order-item") {
    q.items[e.target.dataset.oidx] = e.target.value;
  } else if (field === "group-name") {
    q.groups[e.target.dataset.gidx].name = e.target.value;
  } else if (field === "group-items") {
    q.groups[e.target.dataset.gidx].itemsText = e.target.value;
  } else if (field === "question" || field === "answer" || field === "altAnswers" || field === "hint" || field === "explanation") {
    q[field] = e.target.value;
  }
});

// 변경(select, radio, 파일) 반영
document.getElementById("questions-wrap").addEventListener("change", async (e) => {
  const idx = e.target.dataset.qidx;
  const field = e.target.dataset.field;
  if (idx === undefined || !field) return;
  const q = editingQuestions[idx];

  if (field === "type") {
    const prev = q.type;
    q.type = e.target.value;
    normalizeQuestion(q);
    if (q.type === "ox" && q.answer !== "O" && q.answer !== "X") q.answer = "O";
    if (q.type === "short" && prev === "ox") q.answer = "";
    renderEditor();
  }
  if (field === "mcq-correct") { q.correctIndex = Number(e.target.dataset.cidx); }
  if (field === "ox-answer") { q.answer = e.target.value; }
  if (field === "image-upload") {
    const file = e.target.files[0];
    if (!file) return;
    const base64 = await fileToBase64(file);
    const res = await apiPost("uploadImage", { password: sessionPassword, filename: file.name, mimeType: file.type, base64 });
    if (res.ok) { q.image = res.url; renderEditor(); }
    else alert("이미지 업로드 실패: " + res.error);
  }
});

// 문제 접기/펼치기, 순서변경, 문제/보기 삭제, 보기 추가 (클릭 위임)
document.getElementById("questions-wrap").addEventListener("click", (e) => {
  if (e.target.dataset.moveQ !== undefined) {
    const [idx, dir] = e.target.dataset.moveQ.split(":").map(Number);
    const j = idx + dir;
    if (j >= 0 && j < editingQuestions.length) {
      [editingQuestions[idx], editingQuestions[j]] = [editingQuestions[j], editingQuestions[idx]];
      renderEditor();
    }
    return;
  }
  if (e.target.dataset.removeQ !== undefined) {
    editingQuestions.splice(Number(e.target.dataset.removeQ), 1);
    renderEditor();
    return;
  }
  if (e.target.dataset.addChoice !== undefined) {
    editingQuestions[Number(e.target.dataset.addChoice)].choices.push("");
    renderEditor();
    return;
  }
  if (e.target.dataset.removeChoice !== undefined) {
    const [qidx, cidx] = e.target.dataset.removeChoice.split(":").map(Number);
    editingQuestions[qidx].choices.splice(cidx, 1);
    if (editingQuestions[qidx].correctIndex >= editingQuestions[qidx].choices.length) editingQuestions[qidx].correctIndex = 0;
    renderEditor();
    return;
  }
  if (e.target.dataset.addOrder !== undefined) {
    const q = editingQuestions[Number(e.target.dataset.addOrder)];
    if (q.items.length < MAX_ORDER) q.items.push("");
    renderEditor();
    return;
  }
  if (e.target.dataset.removeOrder !== undefined) {
    const [qi, oi] = e.target.dataset.removeOrder.split(":").map(Number);
    if (editingQuestions[qi].items.length <= 2) { alert("항목은 최소 2개가 필요해요."); return; }
    editingQuestions[qi].items.splice(oi, 1);
    renderEditor();
    return;
  }
  if (e.target.dataset.addGroup !== undefined) {
    const q = editingQuestions[Number(e.target.dataset.addGroup)];
    if (q.groups.length < MAX_GROUPS) q.groups.push({ name: "", itemsText: "" });
    renderEditor();
    return;
  }
  if (e.target.dataset.removeGroup !== undefined) {
    const [qi, gi] = e.target.dataset.removeGroup.split(":").map(Number);
    if (editingQuestions[qi].groups.length <= 2) { alert("분류는 최소 2개가 필요해요."); return; }
    editingQuestions[qi].groups.splice(gi, 1);
    renderEditor();
    return;
  }
  if (e.target.dataset.addPair !== undefined) {
    const q = editingQuestions[Number(e.target.dataset.addPair)];
    if (q.pairs.length < MAX_PAIRS) q.pairs.push({ left: "", right: "" });
    renderEditor();
    return;
  }
  if (e.target.dataset.removePair !== undefined) {
    const [qi, pi] = e.target.dataset.removePair.split(":").map(Number);
    if (editingQuestions[qi].pairs.length <= 2) { alert("짝은 최소 2개가 필요해요."); return; }
    editingQuestions[qi].pairs.splice(pi, 1);
    renderEditor();
    return;
  }
  const toggleEl = e.target.closest("[data-toggle-collapse]");
  if (toggleEl) {
    const idx = Number(toggleEl.dataset.toggleCollapse);
    if (editingQuestions[idx].collapsed) {
      // 아코디언: 하나를 열면 나머지는 자동으로 닫힘
      editingQuestions.forEach((q, i) => { q.collapsed = (i !== idx); });
    } else {
      editingQuestions[idx].collapsed = true;
    }
    renderEditor();
  }
});

async function saveSet() {
  const title = document.getElementById("set-title").value.trim();
  if (!title) { alert("세트 제목을 입력해주세요."); return; }
  if (editingQuestions.length === 0) { alert("문제를 1개 이상 추가해주세요."); return; }

  for (let i = 0; i < editingQuestions.length; i++) {
    const err = validateQuestion(editingQuestions[i]);
    if (err) { alert(`문제 ${i + 1}: ${err}`); return; }
  }

  const questions = editingQuestions.map(q => {
    const out = { type: q.type, question: q.question, image: q.image || "", explanation: q.explanation || "" };
    if (q.type === "mcq") {
      out.choices = q.choices;
      out.answer = q.choices[q.correctIndex] || "";
    } else if (q.type === "ox") {
      out.answer = q.answer || "O";
    } else if (q.type === "match") {
      out.pairs = q.pairs.filter(p => p.left.trim() && p.right.trim()).map(p => ({ left: p.left.trim(), right: p.right.trim() }));
      out.answer = "";
    } else if (q.type === "order") {
      out.items = q.items.map(s => s.trim()).filter(Boolean);
      out.answer = "";
    } else if (q.type === "sort") {
      out.groups = q.groups.map(g => ({ name: g.name.trim(), items: groupItems(g) }));
      out.answer = "";
    } else if (q.type === "blank") {
      out.answer = (q.question.match(/\[[^\]]+\]/g) || []).map(s => s.slice(1, -1)).join(", ");
    } else {
      out.answer = q.answer || "";
      out.altAnswers = q.altAnswers || "";
      out.hint = q.hint || "";
    }
    return out;
  });

  const res = await apiPost("saveSet", { password: sessionPassword, set: { id: editingId, title, questions } });
  if (res.ok) {
    closeEditor();
    loadSets();
  } else {
    alert("저장 실패: " + res.error);
  }
}

// ---------- PPTX 내보내기 (배경 포함, 고정 16:9 캡처) ----------
function questionCaptureHtml(q, revealed) {
  const blocks = [];

  if (q.image) blocks.push(`<div class="pptx-row-image"><img class="q-image" src="${q.image}" crossorigin="anonymous"></div>`);

  blocks.push(`<div class="pptx-row-question"><div class="question-text">${q.type === "blank" ? blankQuestionHtml(q.question, revealed, null, false) : escapeHtml(q.question)}</div></div>`);

  if (q.type === "mcq") {
    const choicesHtml = (q.choices || []).map(c => {
      const isCorrect = revealed && c === q.answer;
      return `<div class="choice-display ${isCorrect ? "correct" : ""}">${escapeHtml(c)}</div>`;
    }).join("");
    blocks.push(`<div class="pptx-row-middle"><div class="choice-list">${choicesHtml}</div></div>`);
  } else if (q.type === "ox") {
    blocks.push(`<div class="pptx-row-middle"><div class="ox-row">
      <div class="ox-box ${revealed && q.answer === "O" ? "correct" : ""}">O</div>
      <div class="ox-box ${revealed && q.answer === "X" ? "correct" : ""}">X</div>
    </div></div>`);
  } else if (q.type === "order") {
    blocks.push(`<div class="pptx-row-middle">${orderHtml(q, revealed)}</div>`);
  } else if (q.type === "sort") {
    blocks.push(`<div class="pptx-row-middle">${sortHtml(q, revealed)}</div>`);
  } else if (q.type === "match") {
    blocks.push(`<div class="pptx-row-middle">${matchHtml(q, revealed)}</div>`);
  } else if (q.type === "short" && q.hint && !revealed) {
    blocks.push(`<div class="pptx-row-middle"><div class="hint-box">${escapeHtml(q.hint)}</div></div>`);
  }

  if (revealed) {
    let answerInner = "";
    if (q.type === "short") {
      answerInner += `<div class="short-answer-display">${escapeHtml(q.answer || "")}</div>`;
    }
    let box = "";
    if (q.type === "short" && q.altAnswers) box += `<div class="explanation">인정 답안: ${escapeHtml(q.altAnswers)}</div>`;
    if (q.explanation) box += `<div class="explanation">${escapeHtml(q.explanation)}</div>`;
    if (box) answerInner += `<div class="answer-box">${box}</div>`;
    if (answerInner) blocks.push(`<div class="pptx-row-answer">${answerInner}</div>`);
  }

  // 내용이 있는 블록만 위에서부터 순서대로 쌓임 — 빈 칸을 강제로 만들지 않아서
  // 문제는 항상 같은 위치(이미지 바로 아래 또는 맨 위)에서 시작하고, 정답은 필요한 만큼만 아래에 붙음
  return blocks.join("");
}

async function exportPptxForSet(id) {
  const res = await apiGet("set", { id });
  if (!res.ok) { alert("세트를 불러오지 못했어요."); return; }
  const full = res.set;

  const includeAnswers = confirm("정답 화면도 슬라이드에 포함할까요? (확인=포함, 취소=문제만)");
  const overlay = document.getElementById("loading-overlay");
  const progressEl = document.getElementById("loading-progress");
  overlay.classList.remove("hidden");

  const slideEl = document.getElementById("pptx-slide-inner");
  const cardEl = document.getElementById("pptx-question-card");
  const pptx = new PptxGenJS();
  pptx.defineLayout({ name: "WIDE", width: 10, height: 5.63 });
  pptx.layout = "WIDE";

  try {
    for (let i = 0; i < full.questions.length; i++) {
      const q = full.questions[i];
      progressEl.innerText = `${i + 1} / ${full.questions.length}`;

      cardEl.innerHTML = questionCaptureHtml(q, false);
      drawMatchLines(cardEl);
      await waitForImages(slideEl);
      await addSlideCapture(pptx, slideEl);

      if (includeAnswers) {
        cardEl.innerHTML = questionCaptureHtml(q, true);
        drawMatchLines(cardEl);
        await waitForImages(slideEl);
        await addSlideCapture(pptx, slideEl);
      }
    }
    await pptx.writeFile({ fileName: `${full.title}.pptx` });
  } catch (e) {
    alert("PPTX 생성 중 문제가 발생했어요: " + e.message);
  } finally {
    overlay.classList.add("hidden");
  }
}

function waitForImages(container) {
  const imgs = container.querySelectorAll("img");
  return Promise.all(Array.from(imgs).map(img => img.complete ? Promise.resolve() :
    new Promise(res => { img.onload = res; img.onerror = res; })));
}

async function addSlideCapture(pptx, el) {
  const canvas = await html2canvas(el, { useCORS: true });
  const dataUrl = canvas.toDataURL("image/png");
  const slide = pptx.addSlide();
  slide.addImage({ data: dataUrl, x: 0, y: 0, w: 10, h: 5.63 });
}

// ---------- 순서 맞추기 / 분류 / 빈칸 공통 ----------
function seededOrder(key, n) {
  let seed = 0;
  for (let i = 0; i < key.length; i++) seed = (seed * 31 + key.charCodeAt(i)) >>> 0;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const order = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  if (n > 1 && order.every((v, i) => v === i)) order.push(order.shift());
  return order;
}

// 순서 맞추기: items는 정답 순서. order[k] = k번째 칸에 놓인 카드(정답 위치 번호)
function orderInitial(q) { return seededOrder((q.question || "") + (q.items || []).join("|"), (q.items || []).length); }
function orderRows(q, order, done) {
  return order.map((it, k) => `<div class="order-slot"><span class="order-no">${k + 1}</span><div class="order-card${done ? " correct" : ""}" data-flip="o${it}" data-item="${it}"><span class="item-text">${escapeHtml(q.items[it])}</span></div></div>`).join("");
}
function orderHtml(q, revealed) {
  const order = revealed ? q.items.map((_, i) => i) : orderInitial(q);
  return `<div class="order-wrap"><div class="flip-area">${orderRows(q, order, revealed)}</div></div>`;
}

// 분류: groups = [{ name, items: [...] }]
function sortItems(q) {
  const out = [];
  (q.groups || []).forEach((g, gi) => (g.items || []).forEach(t => out.push({ text: t, g: gi })));
  return out;
}
function sortPoolOrder(q) { return seededOrder((q.question || "") + JSON.stringify(q.groups || []), sortItems(q).length); }
function sortInner(q, assign, poolOrder, done) {
  const items = sortItems(q);
  const card = i => `<div class="sort-card${done ? " correct" : ""}" data-flip="s${i}" data-item="${i}"><span class="item-text">${escapeHtml(items[i].text)}</span></div>`;
  const pool = poolOrder.filter(i => !(assign[i] >= 0)).map(card).join("");
  const bins = (q.groups || []).map((g, gi) => `<div class="sort-bin" data-group="${gi}"><div class="sort-bin-name item-text">${escapeHtml(g.name)}</div><div class="sort-bin-body">${poolOrder.filter(i => assign[i] === gi).map(card).join("")}</div></div>`).join("");
  return `<div class="sort-pool">${pool}</div><div class="sort-bins" style="grid-template-columns:repeat(${(q.groups || []).length},1fr)">${bins}</div>`;
}
function sortHtml(q, revealed) {
  const assign = {};
  sortItems(q).forEach((it, i) => { assign[i] = revealed ? it.g : -1; });
  return `<div class="sort-wrap"><div class="flip-area">${sortInner(q, assign, sortPoolOrder(q), revealed)}</div></div>`;
}

// 빈칸: 문제 글의 [정답] 부분을 빈칸으로 바꿈
function blankQuestionHtml(text, openAll, openSet, anim) {
  const src = text || "", re = /\[([^\]]+)\]/g;
  let out = "", last = 0, k = -1, di = 0, m;
  while ((m = re.exec(src))) {
    out += escapeHtml(src.slice(last, m.index));
    k++;
    const was = !!(openSet && openSet.has(k));
    const fresh = openAll && anim && !was;
    const delay = fresh ? (0.1 + di++ * 0.35) : 0;
    out += `<span class="blank${(openAll || was) ? " open" : ""}${fresh ? " anim" : ""}" data-b="${k}" style="--d:${delay}s;--w:${Math.max(2, m[1].length)}"><span class="blank-word">${escapeHtml(m[1])}</span></span>`;
    last = m.index + m[0].length;
  }
  return out + escapeHtml(src.slice(last));
}

// ---------- 연결형 (선 잇기) ----------
// 오른쪽 항목 순서: 문제 내용으로 고정된 셔플 (같은 문제는 항상 같은 순서)
function matchOrder(q) {
  const pairs = q.pairs || [], n = pairs.length;
  let seed = 0;
  const key = (q.question || "") + pairs.map(p => p.left + "|" + p.right).join("/");
  for (let i = 0; i < key.length; i++) seed = (seed * 31 + key.charCodeAt(i)) >>> 0;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const order = pairs.map((_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  if (n > 1 && order.every((v, i) => v === i)) order.push(order.shift());
  return order;
}

function matchHtml(q, revealed) {
  const pairs = q.pairs || [];
  const order = matchOrder(q);
  let rows = "";
  pairs.forEach((p, i) => {
    const ri = order[i];
    rows += `<div class="match-item match-left" data-side="L" data-pair="${i}"><span class="match-text">${escapeHtml(p.left)}</span></div>
      <div></div>
      <div class="match-item match-right" data-side="R" data-pair="${ri}"><span class="match-text">${escapeHtml(pairs[ri].right)}</span></div>`;
  });
  return `<div class="match-wrap" data-reveal="${revealed ? 1 : 0}">${rows}<svg class="match-lines"></svg></div>`;
}

// 연결선 색: 사이트 버튼 색(--btn-accent)을 글자색(--text-main) 쪽으로 어둡게 섞어서 자동 계산
function matchLineColor() {
  const cs = getComputedStyle(document.documentElement);
  const rgb = v => { const m = /^#?([0-9a-f]{6})$/i.exec((v || "").trim()); return m ? [0, 2, 4].map(i => parseInt(m[1].substr(i, 2), 16)) : null; };
  const a = rgb(cs.getPropertyValue("--btn-accent")) || [220, 203, 255];
  const b = rgb(cs.getPropertyValue("--text-main")) || [36, 27, 61];
  return `rgb(${a.map((v, i) => Math.round(v * 0.55 + b[i] * 0.45)).join(",")})`;
}
function matchWrongColor() {
  return getComputedStyle(document.documentElement).getPropertyValue("--accent-red-dark").trim() || "#C94F79";
}
function matchSizeSvg(wrap) {
  const svg = wrap.querySelector(".match-lines"), wr = wrap.getBoundingClientRect();
  svg.setAttribute("width", wr.width);
  svg.setAttribute("height", wr.height);
  svg.setAttribute("viewBox", `0 0 ${wr.width} ${wr.height}`);
  wrap.style.setProperty("--match-line", matchLineColor());
  return { svg, wr };
}
function matchPts(wr, l, r) {
  const a = l.getBoundingClientRect(), b = r.getBoundingClientRect();
  return { x1: a.right - wr.left, y1: a.top + a.height / 2 - wr.top, x2: b.left - wr.left, y2: b.top + b.height / 2 - wr.top };
}
function matchLineTag(p, color, extra) {
  return `<line x1="${p.x1}" y1="${p.y1}" x2="${p.x2}" y2="${p.y2}" stroke="${color}" stroke-width="5" stroke-linecap="round" ${extra || ""}/>`;
}

// PPTX 캡처용: 정답 슬라이드에만 정답선을 정적으로 그림
function drawMatchLinesNow(root) {
  root.querySelectorAll(".match-wrap").forEach(wrap => {
    const { svg, wr } = matchSizeSvg(wrap);
    if (wrap.dataset.reveal !== "1") { svg.innerHTML = ""; return; }
    const color = matchLineColor();
    let lines = "";
    wrap.querySelectorAll(".match-left").forEach(l => {
      const r = wrap.querySelector(`.match-right[data-pair="${l.dataset.pair}"]`);
      lines += matchLineTag(matchPts(wr, l, r), color);
    });
    svg.innerHTML = lines;
    wrap.querySelectorAll(".match-item").forEach(el => el.classList.add("correct", "linked"));
  });
}
function drawMatchLines(root) {
  drawMatchLinesNow(root);
  if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(() => drawMatchLinesNow(root));
}

// ---------- 유틸 ----------
function escapeAttr(str) { return escapeHtml(str).replace(/"/g, "&quot;"); }
function escapeHtml(str) {
  const d = document.createElement("div");
  d.innerText = str == null ? "" : String(str);
  return d.innerHTML;
}
function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString("ko-KR"); } catch (e) { return ""; }
}
