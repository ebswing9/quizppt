<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUIZ</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>

<!-- ===== 목록 화면 ===== -->
<div id="view-list" class="view">
  <div class="container">
    <h1 class="page-title">QUIZ</h1>
    <div id="set-list" class="set-list"></div>
  </div>
</div>

<!-- ===== 발표 화면 ===== -->
<div id="view-present" class="view hidden">
  <div class="present-topbar">
    <div class="progress-text" id="progress-text">1 / 5</div>
    <div class="top-btns">
      <button class="btn-ghost btn-sm" id="btn-restart">처음부터</button>
      <button class="btn-ghost btn-sm" id="btn-fullscreen">전체화면</button>
      <button class="btn-ghost btn-sm" id="btn-exit">목록으로</button>
    </div>
  </div>

  <div id="question-capture">
    <div class="card question-card" id="question-card"></div>
    <div class="bottom-actions">
      <button class="btn-gold btn-block" id="btn-reveal">정답 보기</button>
      <button class="btn-primary btn-block hidden" id="btn-next">다음 문제 →</button>
    </div>
  </div>
</div>

<div id="offline-badge" class="offline-badge hidden">오프라인 캐시로 표시 중</div>

<script>
let sets = [];
let currentSet = null;
let curIdx = 0;
let revealed = false;

// ---------- 초기화 ----------
(async function init() {
  await applyBackgroundColors();
  await loadSetList();

  document.getElementById("btn-reveal").addEventListener("click", reveal);
  document.getElementById("btn-next").addEventListener("click", nextQuestion);
  document.getElementById("btn-restart").addEventListener("click", () => { curIdx = 0; revealed = false; matchLinks = {}; renderQuestion(); });
  document.getElementById("btn-exit").addEventListener("click", exitToList);
  document.getElementById("btn-fullscreen").addEventListener("click", toggleFullscreen);

  document.addEventListener("keydown", (e) => {
    if (document.getElementById("view-present").classList.contains("hidden")) return;
    if (e.code === "Space") { e.preventDefault(); revealed ? nextQuestion() : reveal(); }
    if (e.code === "ArrowRight") nextQuestion();
    if (e.code === "ArrowLeft") prevQuestion();
  });
})();

async function loadSetList() {
  try {
    const res = await apiGet("sets");
    if (res.ok) {
      sets = res.sets.filter(s => s.visible !== false);
      localStorage.setItem("quiz_cache_sets", JSON.stringify(sets));
      document.getElementById("offline-badge").classList.add("hidden");
    } else {
      throw new Error(res.error);
    }
  } catch (e) {
    const cached = localStorage.getItem("quiz_cache_sets");
    if (cached) {
      sets = JSON.parse(cached);
      document.getElementById("offline-badge").classList.remove("hidden");
    } else {
      document.getElementById("set-list").innerHTML = "<p>세트를 불러올 수 없어요. 네트워크를 확인해주세요.</p>";
      return;
    }
  }
  renderSetList();
}

function renderSetList() {
  const wrap = document.getElementById("set-list");
  if (sets.length === 0) { wrap.innerHTML = "<p>아직 등록된 세트가 없어요.</p>"; return; }
  wrap.innerHTML = "";
  sets.forEach(s => {
    const el = document.createElement("div");
    el.className = "set-card";
    el.innerHTML = `
      <div class="set-title">${escapeHtml(s.title)}</div>
      <button class="btn-primary btn-sm">시작</button>
    `;
    el.addEventListener("click", () => startSet(s.id));
    wrap.appendChild(el);
  });
}

async function startSet(id) {
  let full;
  try {
    const res = await apiGet("set", { id });
    if (!res.ok) throw new Error(res.error);
    full = res.set;
    localStorage.setItem("quiz_cache_set_" + id, JSON.stringify(full));
  } catch (e) {
    const cached = localStorage.getItem("quiz_cache_set_" + id);
    if (!cached) { alert("세트를 불러오지 못했어요. 네트워크를 확인해주세요."); return; }
    full = JSON.parse(cached);
  }
  currentSet = full;
  matchLinks = {};
  curIdx = 0;
  revealed = false;
  document.getElementById("view-list").classList.add("hidden");
  document.getElementById("view-present").classList.remove("hidden");
  renderQuestion();
  apiPost("markUsed", { id }).catch(() => {}); // 실패해도 발표엔 영향 없음
}

function exitToList() {
  document.getElementById("view-present").classList.add("hidden");
  document.getElementById("view-list").classList.remove("hidden");
  loadSetList();
}

function reveal() { revealed = true; renderQuestion(); }

function nextQuestion() {
  if (curIdx < currentSet.questions.length - 1) {
    curIdx++; revealed = false; renderQuestion();
  } else {
    exitToList();
  }
}
function prevQuestion() {
  if (curIdx > 0) { curIdx--; revealed = false; renderQuestion(); }
}

function renderQuestion() {
  const q = currentSet.questions[curIdx];
  document.getElementById("progress-text").innerText = `${curIdx + 1} / ${currentSet.questions.length}`;
  document.getElementById("btn-reveal").classList.toggle("hidden", revealed || (q.type !== "short" && q.type !== "match"));
  document.getElementById("btn-next").classList.toggle("hidden", !revealed);

  let html = "";
  if (q.image) html += `<img class="q-image" src="${q.image}" crossorigin="anonymous">`;
  html += `<div class="question-text">${escapeHtml(q.question)}</div>`;

  if (q.type === "mcq") {
    html += `<div class="choice-list">`;
    (q.choices || []).forEach((c, i) => {
      const isCorrect = revealed && c === q.answer;
      html += `<div class="choice-display ${isCorrect ? "correct" : ""}" data-choice-click>${escapeHtml(c)}</div>`;
    });
    html += `</div>`;
  } else if (q.type === "ox") {
    html += `<div class="ox-row">
      <div class="ox-box ${revealed && q.answer === "O" ? "correct" : ""}" data-choice-click>O</div>
      <div class="ox-box ${revealed && q.answer === "X" ? "correct" : ""}" data-choice-click>X</div>
    </div>`;
  } else if (q.type === "match") {
    html += matchHtml(q, revealed);
  } else if (q.type === "short" && q.hint && !revealed) {
    html += `<div class="hint-box">${escapeHtml(q.hint)}</div>`;
  }

  if (revealed) {
    if (q.type === "short") {
      html += `<div class="short-answer-display">${escapeHtml(q.answer || "")}</div>`;
    }
    let box = "";
    if (q.type === "short" && q.altAnswers) box += `<div class="explanation">인정 답안: ${escapeHtml(q.altAnswers)}</div>`;
    if (q.explanation) box += `<div class="explanation">${escapeHtml(q.explanation)}</div>`;
    if (box) html += `<div class="answer-box">${box}</div>`;
  }

  document.getElementById("question-card").innerHTML = html;
  setupMatch(document.getElementById("question-card"));

  // mcq/ox는 보기를 클릭하면 바로 정답 공개
  if (!revealed) {
    document.querySelectorAll("[data-choice-click]").forEach(el => {
      el.addEventListener("click", reveal);
    });
  }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

// ---------- 연결형 (선 잇기) ----------
// 오른쪽 항목 순서: 문제 내용으로 고정된 셔플 (같은 문제는 항상 같은 순서)
function matchOrder(q) {
  const pairs = q.pairs || [], n = pairs.length;
  let seed = 0;
  const key = (q.question || "") + pairs.map(p => p.left + "|" + p.right).join("/");
  for (let i = 0; i < key.length; i++) seed = (seed * 31 + key.charCodeAt(i)) >>> 0;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const order = pairs.map((_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  if (n > 1 && order.every((v, i) => v === i)) order.push(order.shift());
  return order;
}

function matchHtml(q, revealed) {
  const pairs = q.pairs || [];
  const order = matchOrder(q);
  let rows = "";
  pairs.forEach((p, i) => {
    const ri = order[i];
    rows += `<div class="match-item match-left" data-side="L" data-pair="${i}"><span class="match-text">${escapeHtml(p.left)}</span></div>
      <div></div>
      <div class="match-item match-right" data-side="R" data-pair="${ri}"><span class="match-text">${escapeHtml(pairs[ri].right)}</span></div>`;
  });
  return `<div class="match-wrap" data-reveal="${revealed ? 1 : 0}">${rows}<svg class="match-lines"></svg></div>`;
}

// 연결선 색: 사이트 버튼 색(--btn-accent)을 글자색(--text-main) 쪽으로 어둡게 섞어서 자동 계산
function matchLineColor() {
  const cs = getComputedStyle(document.documentElement);
  const rgb = v => { const m = /^#?([0-9a-f]{6})$/i.exec((v || "").trim()); return m ? [0, 2, 4].map(i => parseInt(m[1].substr(i, 2), 16)) : null; };
  const a = rgb(cs.getPropertyValue("--btn-accent")) || [220, 203, 255];
  const b = rgb(cs.getPropertyValue("--text-main")) || [36, 27, 61];
  return `rgb(${a.map((v, i) => Math.round(v * 0.55 + b[i] * 0.45)).join(",")})`;
}
function matchWrongColor() {
  return getComputedStyle(document.documentElement).getPropertyValue("--accent-red-dark").trim() || "#C94F79";
}
function matchSizeSvg(wrap) {
  const svg = wrap.querySelector(".match-lines"), wr = wrap.getBoundingClientRect();
  svg.setAttribute("width", wr.width);
  svg.setAttribute("height", wr.height);
  svg.setAttribute("viewBox", `0 0 ${wr.width} ${wr.height}`);
  wrap.style.setProperty("--match-line", matchLineColor());
  return { svg, wr };
}
function matchPts(wr, l, r) {
  const a = l.getBoundingClientRect(), b = r.getBoundingClientRect();
  return { x1: a.right - wr.left, y1: a.top + a.height / 2 - wr.top, x2: b.left - wr.left, y2: b.top + b.height / 2 - wr.top };
}
function matchLineTag(p, color, extra) {
  return `<line x1="${p.x1}" y1="${p.y1}" x2="${p.x2}" y2="${p.y2}" stroke="${color}" stroke-width="5" stroke-linecap="round" ${extra || ""}/>`;
}

// ---- 발표 화면의 연결형 인터랙션 ----
let matchLinks = {};   // 문제번호 → { 왼쪽pair: 오른쪽pair } (학생이 이은 선)
let matchRedraw = null;
window.addEventListener("resize", () => { if (matchRedraw) matchRedraw(); });

function setupMatch(card) {
  const wrap = card.querySelector(".match-wrap");
  if (!wrap) { matchRedraw = null; return; }
  const links = (matchLinks[curIdx] = matchLinks[curIdx] || {});
  const L = i => wrap.querySelector(`.match-left[data-pair="${i}"]`);
  const R = i => wrap.querySelector(`.match-right[data-pair="${i}"]`);
  const items = () => wrap.querySelectorAll(".match-item");
  let sel = null, drag = null, temp = null;

  function draw() {
    const { svg, wr } = matchSizeSvg(wrap);
    const color = matchLineColor();
    let html = "";
    if (revealed) {
      wrap.querySelectorAll(".match-left").forEach(l => { html += matchLineTag(matchPts(wr, l, R(l.dataset.pair)), color); });
      items().forEach(el => el.classList.add("correct", "linked"));
    } else {
      Object.entries(links).forEach(([li, rp]) => { html += matchLineTag(matchPts(wr, L(li), R(rp)), color); });
      if (temp) html += matchLineTag(temp, color, 'stroke-opacity=".5" stroke-dasharray="1 10"');
      const lSet = new Set(Object.keys(links).map(Number)), rSet = new Set(Object.values(links));
      items().forEach(el => {
        const p = Number(el.dataset.pair);
        el.classList.toggle("linked", el.dataset.side === "L" ? lSet.has(p) : rSet.has(p));
        el.classList.toggle("selected", el === sel);
      });
    }
    svg.innerHTML = html;
  }

  // 정답 공개: 틀린 선은 붉게 변했다 사라지고, 빠진 정답선은 하나씩 그려짐
  function playReveal() {
    const { svg, wr } = matchSizeSvg(wrap);
    const color = matchLineColor(), wrong = matchWrongColor();
    let html = "", delay = 0.1;
    const bad = Object.entries(links).filter(([li, rp]) => Number(li) !== rp);
    bad.forEach(([li, rp]) => { html += matchLineTag(matchPts(wr, L(li), R(rp)), wrong, 'style="animation:match-fade .7s ease .5s forwards"'); });
    if (bad.length) delay = 1.0;
    wrap.querySelectorAll(".match-left").forEach(l => {
      const i = Number(l.dataset.pair), p = matchPts(wr, l, R(i));
      if (links[i] === i) { html += matchLineTag(p, color); return; }
      const len = Math.hypot(p.x2 - p.x1, p.y2 - p.y1);
      html += matchLineTag(p, color, `style="stroke-dasharray:${len};stroke-dashoffset:${len};animation:match-draw .5s ease ${delay}s forwards"`);
      delay += 0.5;
    });
    svg.innerHTML = html;
    setTimeout(() => items().forEach(el => el.classList.add("correct", "linked")), (delay + 0.1) * 1000);
  }

  function connect(a, b) {
    const l = a.dataset.side === "L" ? a : b, r = l === a ? b : a;
    const rp = Number(r.dataset.pair);
    Object.keys(links).forEach(k => { if (links[k] === rp) delete links[k]; });
    links[Number(l.dataset.pair)] = rp;
  }
  function isLinked(el) {
    const p = Number(el.dataset.pair);
    return el.dataset.side === "L" ? p in links : Object.values(links).includes(p);
  }
  function unlink(el) {
    const p = Number(el.dataset.pair);
    if (el.dataset.side === "L") delete links[p];
    else Object.keys(links).forEach(k => { if (links[k] === p) delete links[k]; });
  }
  // 클릭 방식: 한쪽 항목 클릭 → 반대쪽 항목 클릭하면 연결 / 이미 이어진 항목을 누르면 연결 해제
  function clickItem(el) {
    if (sel && sel !== el && sel.dataset.side !== el.dataset.side) { connect(sel, el); sel = null; }
    else if (sel === el) sel = null;
    else if (isLinked(el)) { unlink(el); sel = el; }
    else sel = el;
  }

  // 드래그 방식: 항목에서 반대쪽 항목까지 끌어서 연결
  wrap.addEventListener("pointerdown", e => {
    if (revealed) return;
    const el = e.target.closest(".match-item");
    if (!el) return;
    e.preventDefault();
    wrap.setPointerCapture(e.pointerId);
    drag = { el, x: e.clientX, y: e.clientY, moved: false };
  });
  wrap.addEventListener("pointermove", e => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.moved = true;
    const wr = wrap.getBoundingClientRect(), r = drag.el.getBoundingClientRect();
    temp = { x1: (drag.el.dataset.side === "L" ? r.right : r.left) - wr.left, y1: r.top + r.height / 2 - wr.top, x2: e.clientX - wr.left, y2: e.clientY - wr.top };
    draw();
  });
  wrap.addEventListener("pointerup", e => {
    if (!drag) return;
    const d = drag; drag = null; temp = null;
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const target = t && t.closest(".match-item");
    if (d.moved) { if (target && target.dataset.side !== d.el.dataset.side) { connect(d.el, target); sel = null; } }
    else clickItem(d.el);
    draw();
  });
  wrap.addEventListener("pointercancel", () => { drag = null; temp = null; draw(); });

  matchRedraw = draw;
  if (revealed) playReveal(); else draw();
  if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(() => matchRedraw && matchRedraw());
}

// ---------- 유틸 ----------
function escapeHtml(str) {
  const d = document.createElement("div");
  d.innerText = str == null ? "" : String(str);
  return d.innerHTML;
}
function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString("ko-KR"); } catch (e) { return ""; }
}
</script>
</body>
</html>
